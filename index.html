<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you Anna ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Titre principal -->
    <header>
        <h1>Happy Birthday ❤️</h1>
        <p>
            I hope you'll like it :) <br />
            Click on the photos to discover the messages
        </p>
    </header>

    <!-- Zone contenant les images -->
    <main id="galerie">

        <div class="objet" id="cat">
            <img src="images/cat.png" alt="Objet 1">
        </div>

        <div class="objet" id="jeff">
            <img src="images/jeffy.png" alt="Objet 2">
        </div>

        <div class="objet" id="miata">
            <img src="images/miata.png" alt="Objet 3">
        </div>

        <div class="objet" id="couple">
            <img src="images/rogue_gambit.png" alt="Objet 4">
        </div>

    </main>

    <!-- Cadeau caché au début -->
    <button id="cadeau">
        keep discovering memories!
    </button>

    <!-- Message affiché après un clic -->
    <section id="message">
        <p>                     </p>
    </section>

    <!-- Lettre finale -->
    <section id="lettre">
    </section>

    <script src="script.js"></script>

</body>

</html>
